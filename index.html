<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>営業ロープレツール</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ========== トップ画面 ========== -->
  <div id="screen-top" class="screen active">
    <header class="top-header">
      <div class="logo">
        <span class="logo-icon">🎯</span>
        <h1>営業ロープレツール</h1>
      </div>
      <p class="subtitle">実践的な営業シーンを体験して、スキルを磨く</p>
    </header>

    <nav class="main-nav">
      <button class="nav-tab active" data-tab="scenarios">シナリオ</button>
      <button class="nav-tab" data-tab="history">履歴</button>
    </nav>

    <!-- シナリオタブ -->
    <div id="tab-scenarios" class="tab-content active">
      <div class="scenario-sets-area">
        <div class="sets-header">
          <h3>シナリオセット</h3>
          <button type="button" class="btn-add-set" id="btn-add-set">+ 新規登録</button>
        </div>
        <div class="sets-tabs" id="sets-tabs"></div>
      </div>

      <div class="prompt-area">
        <div class="prompt-row">
          <textarea id="prompt-input" class="prompt-input" placeholder="例：アウトバウンド営業のテレアポ、接客のクレーム対応など" rows="2"></textarea>
          <button type="button" class="btn-generate" id="btn-generate">シナリオを生成</button>
        </div>
        <div class="prompt-settings">
          <label>
            <span>OpenAI APIキー：</span>
            <input type="password" id="api-key-input" class="api-key-input" placeholder="sk-...">
          </label>
        </div>
        <div class="script-load-area">
          <label class="script-load-label">
            <span>📄 またはファイルから：</span>
            <input type="file" id="script-file-input" accept=".json,.js" style="display:none">
            <span class="btn-load-script" id="btn-load-script">ファイルを選択</span>
          </label>
        </div>
        <div class="prompt-status" id="prompt-status"></div>
      </div>

      <div class="scenario-bottom-area">
        <div class="scenario-icons" id="scenario-list"></div>
      </div>
    </div>

    <!-- 履歴タブ -->
    <div id="tab-history" class="tab-content">
      <div class="history-list" id="history-list"></div>
    </div>

    <footer class="top-footer">
      <p class="scenario-footer-hint">シナリオを選んでロープレを始めましょう</p>
    </footer>
  </div>

  <!-- ========== ロープレ画面 ========== -->
  <div id="screen-roleplay" class="screen">
    <header class="rp-header">
      <button class="btn-back" id="btn-back" title="戻る">← 戻る</button>
      <div class="rp-header-info">
        <h2 id="rp-title">シナリオタイトル</h2>
        <span class="rp-badge" id="rp-badge">営業</span>
      </div>
      <div class="rp-progress">
        <span id="rp-step">1</span> / <span id="rp-total">5</span>
      </div>
    </header>

    <div class="situation-bar" id="situation-bar">
      <div class="situation-icon">📋</div>
      <p id="situation-text">状況説明がここに表示されます</p>
    </div>

    <div class="chat-area" id="chat-area"></div>

    <div class="voice-controls" id="voice-controls">
      <div class="voice-toggle-group">
        <span class="voice-label">🎙️ 音声モード</span>
        <label class="toggle-switch">
          <input type="checkbox" id="voice-mode-toggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <p class="voice-hint" id="voice-hint">相手の話の後、自動で聞き取り開始</p>
    </div>

    <div class="choices-area" id="choices-area">
      <p class="choices-label" id="choices-label">話してください（自動で聞き取ります）：</p>
      <div class="free-speech-area">
        <div class="speech-transcript" id="speech-transcript"></div>
        <div class="speech-input-row" id="speech-input-row">
          <input type="text" id="speech-text-input" class="speech-text-input" placeholder="音声オフ時はここに入力" autocomplete="off">
          <button type="button" class="btn-send-speech" id="btn-send-speech">送信</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== 結果画面 ========== -->
  <div id="screen-result" class="screen">
    <div class="result-container">
      <div class="result-icon" id="result-icon">🏆</div>
      <h2 class="result-title" id="result-title">お疲れさまでした！</h2>

      <div class="score-card">
        <div class="score-circle" id="score-circle">
          <span class="score-number" id="score-number">0</span>
          <span class="score-unit">点</span>
        </div>
        <p class="score-label" id="score-label">スコア</p>
      </div>

      <div class="result-rank" id="result-rank">
        <span class="rank-badge">Aランク</span>
        <p class="rank-desc">素晴らしい対応力です！</p>
      </div>

      <div class="result-feedback" id="result-feedback"></div>

      <div class="result-actions">
        <button class="btn-primary" id="btn-retry">もう一度挑戦する</button>
        <button class="btn-secondary" id="btn-home">シナリオ選択に戻る</button>
      </div>
    </div>
  </div>

  <script src="js/scenarios.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
